name: PharmaWMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: "Deploy to Azure Production (https://minkas.tech)"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # 1. Backend Quality Gate (Spring Boot 4.1 + Modulith + Testcontainers + JaCoCo)
  # ============================================================================
  backend-ci:
    name: Backend (Java 21 · Modulith · 89 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Unit, Modulith & Testcontainers Integration Tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Upload JaCoCo Coverage & Modulith Architecture Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/spring-modulith-docs/
          retention-days: 14

  # ============================================================================
  # 2. AI Service & Synthetic Data Generator Gate (FastAPI + LightGBM + SHAP)
  # ============================================================================
  ai-service-ci:
    name: AI Service (Python 3.12 · LightGBM · 30 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run AI Forecasting & Seed Integrity Test Suite
        run: pytest -v

  # ============================================================================
  # 3. Frontend Quality Gate (Next.js 16 · TypeScript Strict · ESLint · Unit Tests)
  # ============================================================================
  frontend-ci:
    name: Frontend (Next.js 16 · TypeCheck · Lint · Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Standalone Bundle (35 Routes)
        env:
          BACKEND_URL: http://backend:8080
        run: npm run build

  # ============================================================================
  # 4. Full-Stack E2E Smoke Gate (Docker Compose + 33 API Lifecycle Assertions)
  # ============================================================================
  e2e-smoke-gate:
    name: Full-Stack E2E Smoke Gate (Docker Compose · 33 Checks)
    runs-on: ubuntu-latest
    needs: [backend-ci, ai-service-ci, frontend-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start Docker Compose stack
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --build

      - name: Wait for Backend & AI Service to become healthy
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pharmawms-backend-1 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/actuator/health

      - name: Execute 33 End-to-End Business Lifecycle Smoke Checks
        run: |
          python3 scripts/datagen/seed.py --container pharmawms-postgres-1 --redis-container pharmawms-redis-1
          python3 scripts/smoke_test.py --base http://localhost:8080/api/v1

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # ============================================================================
  # 5. Continuous Deployment to Azure Production (https://minkas.tech)
  # ============================================================================
  deploy-production:
    name: Deploy to Azure Production (https://minkas.tech)
    runs-on: ubuntu-latest
    needs: [e2e-smoke-gate]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true)
    environment:
      name: production
      url: https://minkas.tech
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key for Azure VM
        if: env.AZURE_VM_SSH_KEY != ''
        env:
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AZURE_VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${AZURE_VM_HOST:-85.211.247.249}" >> ~/.ssh/known_hosts

      - name: Sync repository & rolling-update production stack on Azure VM
        if: env.AZURE_VM_SSH_KEY != ''
        env:
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          HOST="${AZURE_VM_HOST:-85.211.247.249}"
          USER="${AZURE_VM_USER:-azureuser}"

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'infra/.env' \
            --exclude 'backend/target' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/.next' \
            --exclude 'ai-service/.venv' \
            ./ "${USER}@${HOST}:/home/${USER}/pharmawms/"

          ssh "${USER}@${HOST}" "sudo bash -s" << 'EOF'
            set -euo pipefail
            cd /home/azureuser/pharmawms
            chmod +x infra/deploy-azure.sh infra/backup-db.sh

            echo "1. Taking pre-deployment PostgreSQL snapshot..."
            ./infra/backup-db.sh || true

            echo "2. Building & rolling out updated containers..."
            docker compose --env-file infra/.env -f infra/docker-compose.prod.yml up -d --build --remove-orphans
            docker exec pharmawms-caddy-1 caddy reload --config /etc/caddy/Caddyfile || true

            echo "3. Waiting for backend and frontend healthchecks..."
            for i in {1..60}; do
              BE=$(docker inspect --format='{{.State.Health.Status}}' pharmawms-backend-1 2>/dev/null || echo "starting")
              FE=$(docker inspect --format='{{.State.Health.Status}}' pharmawms-frontend-1 2>/dev/null || echo "starting")
              if [ "$BE" = "healthy" ] && [ "$FE" = "healthy" ]; then
                echo "Both backend and frontend are healthy!"
                break
              fi
              sleep 3
            done
            docker image prune -f
          EOF

      - name: Post-Deploy HTTPS Live Verification (https://minkas.tech)
        run: |
          curl -fsS https://minkas.tech/actuator/health | grep -q '"status":"UP"'
          curl -fsSI https://minkas.tech/login | head -n 1
          curl -fsS https://minkas.tech/v3/api-docs | grep -q '"https://minkas.tech"'
          echo "Production verification on https://minkas.tech succeeded!"
